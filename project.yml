name: FontManager
options:
  bundleIdPrefix: co.trumancreative
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.11.0"

targets:
  WOFF2Kit:
    type: library.static
    platform: macOS
    sources:
      - path: ThirdParty/brotli/common
        buildPhase: sources
      - path: ThirdParty/brotli/dec
        buildPhase: sources
      - path: ThirdParty/brotli/enc
        buildPhase: sources
      - path: ThirdParty/woff2/src
        buildPhase: sources
      - path: WOFF2Kit
        buildPhase: sources
    settings:
      base:
        PRODUCT_NAME: WOFF2Kit
        GCC_C_LANGUAGE_STANDARD: c11
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ThirdParty/woff2/include"
          - "$(SRCROOT)/ThirdParty/woff2/src"
          - "$(SRCROOT)/ThirdParty/brotli/include"
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO

  # Two app targets share all sources. Differences live in compile flags, entitlements
  # and Info.plist keys — keep anything build-specific behind `#if APPSTORE`.

  # Open-source build: GitHub download, Sparkle auto-updates, not sandboxed.
  FontManager:
    type: application
    platform: macOS
    sources:
      - path: FontManager
        excludes:
          - Info-AppStore.plist
          - "*.entitlements"
    dependencies:
      - target: WOFF2Kit
      - package: Sparkle
      - package: MCP
    info:
      path: FontManager/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: "public.app-category.utilities"
        NSHumanReadableCopyright: "© 2026 Trey Hardin · MIT Licensed"
        ITSAppUsesNonExemptEncryption: false
        # Sparkle auto-update
        SUFeedURL: "https://github.com/treyhardin/woffle/releases/latest/download/appcast.xml"
        SUPublicEDKey: "m/iJK41QKnw6jETwwNI/u7nedlGifF6y8VaDi9e2LpY="
        SUEnableAutomaticChecks: true
    settings:
      base: &appSettings
        PRODUCT_BUNDLE_IDENTIFIER: co.trumancreative.Woffle
        PRODUCT_NAME: Woffle
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: 5
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: FontManager/FontManager-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/WOFF2Kit"
        OTHER_LDFLAGS:
          - "-lc++"
      configs:
        # "Preview": its own identity and a throwaway data folder, wiped every launch
        # (see AppEnvironment) — for testing first-run flows without touching real data.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: co.trumancreative.Woffle.preview
          PRODUCT_NAME: Woffle (Preview)
    entitlements:
      path: FontManager/FontManager.entitlements
      properties:
        com.apple.security.app-sandbox: false

  # Mac App Store build: sandboxed, no Sparkle (the App Store delivers updates).
  FontManagerAppStore:
    type: application
    platform: macOS
    sources:
      - path: FontManager
        excludes:
          - Info.plist
          - "*.entitlements"
          - Views/UpdaterViews.swift
    dependencies:
      - target: WOFF2Kit
      - package: MCP
    info:
      path: FontManager/Info-AppStore.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: "public.app-category.utilities"
        NSHumanReadableCopyright: "© 2026 Trey Hardin · MIT Licensed"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        <<: *appSettings
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE"
      configs:
        # Distinct name for local runs so it doesn't overwrite the open-source Debug app
        # (and is easy to tell apart). Release/archive keeps the real name.
        Debug:
          PRODUCT_NAME: Woffle (App Store)
    entitlements:
      path: FontManager/FontManager-AppStore.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Source folders and save locations the user picks, kept across launches.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # The optional MCP server (localhost + Tailscale only).
        com.apple.security.network.server: true
